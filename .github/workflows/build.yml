name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build GUI and CLI
    runs-on: windows-latest
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: |
          cd common
          flutter pub get
          cd ../cli
          flutter pub get --offline || flutter pub get
          cd ../gui
          flutter pub get --offline || flutter pub get
          flutter gen-l10n

      - name: Build CLI (Windows EXE)
        run: |
          cd cli
          dart compile exe lib/main.dart -o reboot_cli.exe

      - name: Build GUI (Windows)
        run: |
          cd gui
          flutter build windows --release

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          
          # CLI
          if (Test-Path "cli/reboot_cli.exe") {
            Copy-Item "cli/reboot_cli.exe" -Destination "release_assets/"
          }
          
          # GUI
          $guiPath = "gui/build/windows/x64/runner/Release"
          if (Test-Path $guiPath) {
            Get-ChildItem -Path "$guiPath/*" | Copy-Item -Destination "release_assets/" -Recurse -Force
          }
          
          # Additional DLLs
          $dllPath = "gui/dependencies/dlls"
          if (Test-Path $dllPath) {
            Get-ChildItem -Path "$dllPath/*.dll" | Copy-Item -Destination "release_assets/" -Force -ErrorAction SilentlyContinue
          }
          
          # Create Zip
          Compress-Archive -Path "release_assets/*" -DestinationPath "reboot_windows.zip" -Force

      - name: Generate Release Tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "Build-" + (Get-Date -Format "yyyy.MM.dd-HHmm")
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Push Release to Fork
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Automated build for Reboot 30.10+
            
            **Included:**
            - `reboot_cli.exe`
            - `reboot_windows.zip` (GUI and all tools)
          draft: false
          make_latest: true
          prerelease: false
          files: |
            cli/reboot_cli.exe
            reboot_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
