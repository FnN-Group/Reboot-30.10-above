name: Build Reboot 30.10+ Support

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - '30.10*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release display name'
        required: false
        default: 'Reboot 30.10+ Support'

jobs:
  build:
    name: Build CLI + GUI (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter 3.32.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        shell: pwsh
        run: |
          Push-Location common;  flutter pub get; Pop-Location
          Push-Location cli;     flutter pub get; Pop-Location
          Push-Location gui;     flutter pub get; flutter gen-l10n; Pop-Location

      - name: Build CLI (reboot_cli.exe)
        shell: pwsh
        run: |
          Push-Location cli
          dart compile exe lib/main.dart -o reboot_cli.exe
          Pop-Location

      - name: Build GUI (Windows Release)
        shell: pwsh
        run: |
          Push-Location gui
          flutter build windows --release
          Pop-Location

      - name: Stage Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path stage\cli  | Out-Null
          New-Item -ItemType Directory -Force -Path stage\gui  | Out-Null

          # CLI
          Copy-Item cli\reboot_cli.exe stage\cli\ -Force

          # GUI runner output
          $guiRelease = "gui\build\windows\x64\runner\Release"
          if (-not (Test-Path $guiRelease)) { throw "GUI build output not found at $guiRelease" }
          Copy-Item "$guiRelease\*" stage\gui\ -Recurse -Force

          # Bundled DLLs (cobalt/console/memory/sinum/starfall)
          $dlls = "gui\dependencies\dlls"
          if (Test-Path $dlls) {
            Get-ChildItem "$dlls\*.dll" | Copy-Item -Destination stage\gui\ -Force
          }

      - name: Package release archive
        shell: pwsh
        env:
          BUILD_SIGNATURE: ${{ secrets.BUILD_SIGNATURE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:BUILD_SIGNATURE)) {
            throw "BUILD_SIGNATURE secret is not configured. Set it under Settings > Secrets and variables > Actions."
          }
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found." }

          # AES-256 + header encryption (filenames hidden without password)
          & $sevenZip a -t7z -mx=9 -mhe=on "-p$env:BUILD_SIGNATURE" `
              "reboot_30.10-plus.7z" "stage\*" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z packaging failed (exit $LASTEXITCODE)" }

      - name: Resolve Release Tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag  = "${{ github.ref_name }}"
            $name = "${{ github.event.inputs.release_name }}"
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "Reboot 30.10+ Support ($tag)" }
          } else {
            $stamp = Get-Date -Format "yyyy.MM.dd-HHmm"
            $tag   = "30.10-plus-$stamp-${{ github.run_number }}"
            $name  = "${{ github.event.inputs.release_name }}"
            if ([string]::IsNullOrWhiteSpace($name)) { $name = "Reboot 30.10+ Support" }
          }
          "tag=$tag"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          body: |
            **Reboot Launcher — 30.10+ Support build**

            Encrypted archive — distribution restricted.
            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            reboot_30.10-plus.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
