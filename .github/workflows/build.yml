name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build GUI and CLI
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies (Common)
        run: |
          cd common
          flutter pub get

      - name: Get Dependencies (CLI)
        run: |
          cd cli
          flutter pub get

      - name: Get Dependencies (GUI)
        run: |
          cd gui
          flutter pub get

      - name: Build CLI (Windows EXE)
        run: |
          cd cli
          dart compile exe lib/main.dart -o reboot_cli.exe

      - name: Build GUI (Windows)
        run: |
          cd gui
          flutter build windows --release

      - name: Prepare Artifacts
        run: |
          mkdir -p release_assets
          # Copy CLI
          cp cli/reboot_cli.exe release_assets/
          
          # Copy GUI build files
          if [ -d "gui/build/windows/x64/runner/Release" ]; then
            cp -r gui/build/windows/x64/runner/Release/* release_assets/
          fi
          
          # Copy extra DLLs if they exist
          if [ -d "gui/dependencies/dlls" ]; then
            cp gui/dependencies/dlls/*.dll release_assets/ 2>/dev/null || true
          fi
          
          # Zip everything
          cd release_assets
          7z a ../reboot_windows.zip *

      - name: Generate Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=Manual-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Push Release to Fork
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Automated build for Reboot 30.10+
            
            **Included:**
            - `reboot_cli.exe`
            - `reboot_windows.zip` (GUI and all tools)
          draft: false
          prerelease: false
          files: |
            cli/reboot_cli.exe
            reboot_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
