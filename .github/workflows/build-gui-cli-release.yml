name: Build GUI and CLI Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable

      - name: Build CLI executable
        shell: bash
        run: |
          cd cli
          dart pub get
          dart compile exe lib/main.dart -o build/reboot-cli.exe

      - name: Build GUI (Windows)
        shell: bash
        run: |
          cd gui
          flutter pub get
          flutter build windows --release

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path "cli/build/reboot-cli.exe" -DestinationPath "artifacts/reboot-cli-windows.zip" -Force
          Compress-Archive -Path "gui/build/windows/x64/runner/Release/*" -DestinationPath "artifacts/reboot-gui-windows.zip" -Force

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/reboot-cli-windows.zip
            artifacts/reboot-gui-windows.zip
