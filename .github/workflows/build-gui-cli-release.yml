name: Build GUI and CLI Release Artifacts

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.5.3'

      - name: Build CLI executable
        shell: bash
        run: |
          cd cli
          dart pub get
          dart compile exe lib/main.dart -o build/reboot-cli.exe

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-exe
          path: cli/build/reboot-cli.exe

  build-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable
          cache: true

      - name: Build GUI (Windows)
        shell: bash
        run: |
          cd gui
          flutter pub get
          flutter build windows --release

      - name: Locate GUI Release Directory
        id: locate-gui
        shell: pwsh
        run: |
          $guiOutputCandidates = @(
            "gui/build/windows/x64/runner/Release",
            "gui/build/windows/x64/Release/Runner"
          )
          $guiOutput = $guiOutputCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $guiOutput) {
            throw "Expected GUI output directory not found in: $($guiOutputCandidates -join ', ')"
          }
          Write-Output "gui_path=$guiOutput" >> $env:GITHUB_OUTPUT

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-release
          path: ${{ steps.locate-gui.outputs.gui_path }}/*

  package-and-release:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Download CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-exe
          path: cli-artifact

      - name: Download GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: gui-release
          path: gui-artifact

      - name: Package artifacts
        shell: bash
        run: |
          mkdir artifacts
          cd cli-artifact
          zip -r ../artifacts/reboot-cli-windows.zip *
          cd ../gui-artifact
          zip -r ../artifacts/reboot-gui-windows.zip *
          cd ..

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "30.10-support"
          name: "30.10+ Support"
          files: |
            artifacts/reboot-cli-windows.zip
            artifacts/reboot-gui-windows.zip